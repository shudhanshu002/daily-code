<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Splash Screen</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #0a0f1f; /* navy black */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .circle-img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      overflow: hidden;
      animation: fade 2s ease-in-out;
    }

    .circle-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes fade {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
